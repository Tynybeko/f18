<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      box-sizing: border-box;
      margin: 0;
    }

    header {
      display: flex;
      width: 100%;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid green;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.444);
      top: 0;
      left: 0;
    }

    .opened {
      display: flex;
    }

    .modal_inner {
      display: flex;
      background-color: white;
      max-width: 500px;
      padding: 20px;
      border-radius: 20px;
      position: relative;
    }

    .close_btn {
      position: absolute;
      top: 10px;
      transition: transform .3s ease-in-out;
      right: 10px;
    }

    .close_btn:hover {
      cursor: pointer;
      transform: scale(1.1);
    }


    .close_btn:hover svg path {
      fill: green;
    }

    .close_btn svg {
      transition: all .3s ease-in-out;
      width: 20px;
      height: 20px;
    }
  </style>
</head>

  </header>
