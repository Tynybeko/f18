<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    .flowers {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;

    }

    .flower_item {
      border: 1px solid black;
      display: flex;
      flex-direction: column;
      gap: 2;
      padding: 5px;
    }

    .flower_item img {
      width: 200px;
      height: 200px;
      object-fit: cover;
    }

    .pagination {
      display: flex;
      align-items: center;
      margin: 0 auto;
      gap: 20px;
    }

    .pagination .pagination_items {
      display: flex;
      gap: 10px;
      align-items: center;



    }

    .pagination_btn {
      text-align: center;
      background-color: transparent;
      padding: 3px 5px;
      border-radius: 5px;
    }



    .pagination .pagination_items_item {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      text-align: center;
    }

    .pagination_actions {
      transition: all .3s ease-in-out;
      cursor: pointer;
      border: 1px solid green;
    }

    .pagination_actions:hover {
      background-color: green;
      color: white;
    }

    .pagination_actions.active {
      background-color: green;
      color: white;
    }

    .pagination_btn:disabled {
      background-color: grey;
      color: white;
      cursor: auto;
    }
  </style>
</head>

<body>
  <section class="flowers">

  </section>
  <div class="pagination">
    <button class="pagination_btn pagination_actions prev">PREV</button>
    <nav class="pagination_items">
      <p class="pagination_items_item pagination_actions ">1</p>
    </nav>
    <button class="pagination_btn pagination_actions next">NEXT</button>

  </div>
  <template id="flower_template">
    <div class="flower_item">
      <img src="" alt="">
      <h3>Title</h3>
      <p>PRICE</p>
    </div>
  </template>

  <script src="./test.js"></script>
</body>

</html>
