<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    .parents-block {
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 100%;
    }

    .parents-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border: 1px solid black;
      border-radius: 20px;
      padding: 20px;
      max-width: 300px;
      transition: all .3s ease-in-out;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .parents-item .loading {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 10;
      background-color: rgba(8, 8, 8, 0.411);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .parents-item .loading.hidden {
      display: none;
    }

    .parents-item h3 {
      border-bottom: 1px solid red;
    }

    .parents-item.child {
      max-width: 100%;
    }

    .parents-item .childs {
      display: none;
      gap: 10px;

    }

    .parents-item.child .childs {
      display: flex;
      flex-direction: column;
    }

    .parents-item.child .childs .parents-item {
      max-width: 100%;
    }

    .loader-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    /* Hidden state */
    .hidden {
      display: none;
    }

    /* Spinner */
    .spinner {
      width: 60px;
      height: 60px;

      border: 6px solid #ccc;
      border-top: 6px solid #3498db;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <section class="parents-block">

  </section>
  <template id="parent_template">
    <div class="parents-item">
      <div class="loading hidden">
        <p>Loading...</p>
      </div>
      <h3 class="fullname">John Smith</h3>
      <p class="address">City: <strong>Tashkent</strong></p>
      <p class="age">Email: <strong>25</strong></p>
      <div class="childs"></div>
    </div>
  </template>


  <div id="loader" class="loader-backdrop hidden">
    <div class="spinner"></div>
  </div>

  <script src="./test.js"></script>
</body>

</html>
